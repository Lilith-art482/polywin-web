<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; background: #131722; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
#chart { width: 100%; height: 100%; }
.info-bar {
  position: absolute; top: 8px; left: 12px; right: 12px;
  display: flex; align-items: center; gap: 12px;
  font-size: 12px; color: #787b86; z-index: 10;
}
.info-bar .price { font-size: 16px; font-weight: 600; color: #d1d4dc; }
.info-bar .change { font-size: 12px; font-weight: 500; }
.info-bar .change.up { color: #26a69a; }
.info-bar .change.down { color: #ef5350; }
.info-bar .source { margin-left: auto; font-size: 10px; color: #555; }
</style>
</head>
<body>
<div class="info-bar">
  <span class="price" id="price">--</span>
  <span class="change" id="change"></span>
  <span class="source">Chainlink Oracle</span>
</div>
<div id="chart"></div>
<script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>
<script src="chainlink-chart.js"></script>
</body>
</html>
